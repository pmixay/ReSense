resense:
  sensor:
    forward: -y
    left: +x
    up: +z
    min_range: 2.5
    max_range: 250.0
    frame_id: hesai_lidar
  track:
    lateral_center: -0.1
    yaw_deg: 0.0
    curvature: 0.0
    floor_fit_range:
    - 3.0
    - 120.0
    floor_bin: 2.0
    floor_percentile: 20.0
    floor_halfwidth: 1.0
    floor_min_points: 15
    floor_poly_degree: 2
    floor_max_residual: 0.35
    floor_smoothing: 0.5
    rails_enabled: true
    rails_range:
    - 4.0
    - 30.0
    rails_search_halfwidth: 2.5
    rails_bin: 0.05
    rails_percentile: 85.0
    rails_spacing: 1.59
    rails_min_score: 0.05
    rails_head_height:
    - 0.08
    - 0.5
    rails_smoothing: 0.7
    rail_offset_default: 0.35
    walls_enabled: true
    walls_range:
    - 6.0
    - 160.0
    walls_band:
    - 1.6
    - 2.8
    walls_bin: 4.0
    walls_min_points: 3
    walls_percentile: 90.0
    walls_max_residual: 0.4
    walls_min_bins: 6
    walls_max_rms: 0.35
    walls_max_yaw: 0.06
    walls_min_radius: 150.0
    walls_smoothing: 0.6
    axis_valid_margin: 15.0
    axis_valid_straight_bonus: 50.0
    floor_valid_margin: 20.0
    rails_yaw_enabled: true
    rails_yaw_slabs: 3
    rails_yaw_min_slabs: 2
    rails_yaw_max_dev: 0.3
    axis_max_yaw_rate: 0.003
    axis_max_curvature_rate: 0.0001
    axis_sides_max_disagreement: 0.00067
    axis_disagree_range: 60.0
    axis_one_side_range: 120.0
    floor_verify_enabled: true
    floor_verify_band:
    - 1.6
    - 3.5
    floor_verify_bin: 5.0          # m, along-track bin of the side-base profile
    floor_verify_window: 30.0      # m, window whose median deviation must stay within the tolerance
    floor_verify_tolerance: 0.5    # m, allowed deviation of the far side base from its near-range height
    floor_verify_min_points: 5     # side points per bin for the bin to count
    floor_verify_max_range: 250.0  # m, how far the verification is attempted
  gauge:
    profile:
    - - -0.95
      - 0.12
    - - 0.95
      - 0.12
    - - 0.95
      - 0.55
    - - 1.4
      - 0.55
    - - 1.4
      - 3.5
    - - -1.4
      - 3.5
    - - -1.4
      - 0.55
    - - -0.95
      - 0.55
    warning_margin: 0.35
    range_min: 3.0
    range_max: 250.0
    lateral_growth_per_100m: 0.0
    edge_margin: 0.0
    edge_margin_per_100m: 0.0
  cluster:
    eps: 0.35
    range_scale: 40.0
    voxel: 0.05
    min_samples: 3
    min_points: 5
    min_points_far: 3
    far_range: 100.0
    max_extent: 8.0
    min_height: 0.08
    thin_min_length: 3.0
    thin_max_width: 0.35
    thin_max_height: 0.25
    hardware_max_top: 0.35
    hardware_max_width: 0.4
    hardware_max_height: 0.3
    linear_min_aspect: 5.0
    linear_max_height: 0.8
    linear_min_lateral: 0.8
    wall_min_height: 1.9
    wall_min_lateral: 1.2
    wall_segment_min_length: 4.0
    wall_segment_max_width: 1.5
    gauge_min_points: 3
    overhead_min_height: 2.4
    column_min_height: 2.2
    column_max_width: 1.0
    elevated_min_height: 1.2
    elevated_min_width: 2.0
    floating_min_height: 0.7
    floating_max_height: 1.5
    floating_max_width: 1.0
    edge_min_lateral: 1.2
    edge_min_aspect: 2.5
    edge_max_height: 1.0
    wall_face_min_height: 1.5
    wall_face_edge: 1.6
    wall_face_min_inner: 0.3
    visibility_ratio: 0.15
    retro_intensity: 0.0
    retro_min_fraction: 0.5    # fraction of retro returns for a cluster to count as a reflector
    retro_max_height: 1.2      # m, taller retro clusters (person in a hi-vis vest, train) keep their zone
    retro_max_width: 0.8       # m, narrower retro clusters (plate, sign, marker, post) -> advisory
  tracking:
    gate_base: 1.5
    gate_per_m: 0.02
    ego_speed_max: 25.0
    frame_dt: 0.1
    confirm_hits: 3
    confirm_time_s: 0.3
    hit_window: 10
    min_hit_fraction: 0.6
    zone_window: 10
    zone_min_fraction: 0.6
    max_misses: 3
    conf_gain: 0.35
    conf_decay: 0.25
    conf_threshold: 0.6
  accumulation:
    enabled: true
    n_frames: 5                    # frames merged (the current one included)
    min_range: 40.0                # m, only candidates beyond this range are accumulated
    min_points_scale: 0.3          # per merged frame the voxel-count thresholds grow by this fraction (x1.5 at 5 frames)
    estimate_speed: false
    speed_min_confidence: 0.5      # below this the estimate is not used: source 'none', no accumulation
    speed_max: 30.0                # m/s, search range of the estimator
    speed_max_step: 3.0            # m/s, larger frame-to-frame jumps of the estimate halve its confidence
    speed_warmup_frames: 3         # frames the estimator observes before it reports (static-pattern background)
    tracks_min_speed: 1.0
    min_speed: 1.0
    smear_max_length: 2.0          # m, an accumulated cluster longer than this along X falls back to its current-frame points
    smear_max_width: 1.0
    max_points_per_frame: 20000    # cap on stored far candidates per frame (strided subsample above)
    stamp_dt_range:
    - 0.02
    - 0.5
  voxel: 0.0
