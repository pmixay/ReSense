resense:
  sensor:
    forward: -y
    left: +x
    up: +z
    min_range: 2.5
    max_range: 250.0
    frame_id: hesai_lidar
    roll_deg: 0.0                  # fixed mount correction after the axis mapping (v0.6); the auto-calibration refines on top
    pitch_deg: 0.0
    yaw_deg: 0.0
  track:
    lateral_center: -0.1
    yaw_deg: 0.0
    curvature: 0.0
    floor_fit_range:
    - 3.0
    - 120.0
    floor_bin: 2.0
    floor_percentile: 20.0
    floor_halfwidth: 1.0
    floor_min_points: 15
    floor_poly_degree: 2
    floor_max_residual: 0.35
    floor_smoothing: 0.5
    floor_shadow_height: 1.0       # on since 25.09 (P3, rail shadow; 0 = off): bed bins this far above the previous bed, two in a row starting within floor_shadow_range, start a shadow; the bed fit and the rail pair then use the track in front of the object, or hold the previous model (set O #1: wrong-distance frames 12 -> 0)
    floor_shadow_range: 30.0       # 25.09: m (40 fired at 37-38.5 m on doubleT_platform and added a false alarm)
    floor_shadow_min_bins: 5
    floor_shadow_max_hold: 20      # review 25.09: frames; after this many held frames in a row the rule is released until no shadow is found (a pitch step held the bed for good); set O #1 holds 14; 0 = no cap
    floor_far_min_width: 0.0       # 25.09 (P3 bed_bin): m; a far bed bin narrower than this with an object standing on it is dropped from the fit; 0 = off
    floor_far_from: 90.0           # m, bin centre from which that check applies (the real bed stops returning beyond ~90 m)
    floor_far_min_standing: 2      # points 0.3-1.5 m above the narrow bin's low points needed to drop it (0 = drop every narrow far bin)
    rails_enabled: true
    rails_range:
    - 4.0
    - 30.0
    rails_search_halfwidth: 2.5
    rails_bin: 0.05
    rails_percentile: 85.0
    rails_spacing: 1.59
    rails_min_score: 0.05
    rails_head_height:
    - 0.08
    - 0.5
    rails_smoothing: 0.7
    rail_offset_default: 0.35
    walls_enabled: true
    walls_range:
    - 6.0
    - 160.0
    walls_band:
    - 1.6
    - 2.8
    walls_bin: 4.0
    walls_min_points: 3
    walls_percentile: 90.0
    walls_max_residual: 0.4
    walls_min_bins: 6
    walls_max_rms: 0.35
    walls_max_yaw: 0.09
    walls_min_radius: 150.0
    walls_smoothing: 0.6
    walls_min_far_support: 0.0     # 25.09, 0 = off: with both sides fitted, a side keeping fewer than this fraction of its boundary bins beyond rails_range[1] within walls_max_residual of its own fit does not set the axis shape when the other side's do and it is nearly straight (the 82.9 m platform end, EXPERIMENTS 1h)
    walls_far_support_max_curvature: 0.0002  # 1/m, walls_min_far_support overrules only towards a side this straight (R >= 5 km): never on a real curve
    walls_far_support_frames: 1    # 25.09: walls_min_far_support applies from the N-th consecutive frame its condition holds (a station stop, not a one-frame spurious side)
    axis_valid_margin: 15.0
    axis_valid_straight_bonus: 50.0
    floor_valid_margin: 20.0
    rails_yaw_enabled: true
    rails_yaw_slabs: 3
    rails_yaw_min_slabs: 2
    rails_yaw_max_dev: 0.3         # near slab ridge tolerance; also the far-rail disagreement needed to replace a station-wall bend
    rails_far_check_enabled: false # experimental station-wall axis correction; opt-in until real-data A/B and timing
    rails_far_rings: false         # 29.09 (experimental, off; needs rails_far_check_enabled): far rail evidence from single LiDAR ring crossings (resense/farrails.py, scripts/far_rail_yield.py; assumes sensor.roll/pitch/yaw_deg 0, the default: a configured fixed tilt smears the rings and no far evidence is found) instead of the slab profile that never finds a pair beyond rails_range[1]; off: fails the full gate on the recordings (CHANGELOG 29.09)
    axis_max_yaw_rate: 0.003
    axis_max_curvature_rate: 0.0001
    axis_warmup_frames: 5          # v0.6: no rate limits for this many frames after a (re)seed of the track model
    rates_per_period: true         # on since 25.09 (P3, SCORECARD #13): the axis rate limits and the warm-up per nominal frame period (tracking.frame_dt), not per processed frame (x k, k = the input rate: 1 at 10 Hz, 2 at 5 Hz); 5 Hz five bags 13 / 17 -> 10 / 10 events / STOP episodes with the next flag, 10 Hz gate identical (EXPERIMENTS.md 1i)
    walls_smoothing_per_period: true   # on since 25.09 (P3): walls_smoothing (axis yaw / curvature EMA) per nominal frame period (a^k); floor / rails smoothing stay per frame
    axis_sides_max_disagreement: 0.00067
    axis_disagree_range: 60.0
    axis_one_side_range: 120.0
    axis_disagree_hold: 0          # 27.09 (P4 history, off; 0 = off): nominal frame periods the axis_disagree_range cap outlives the last frame with two disagreeing boundaries, on frames with one boundary (two agreeing end it): losing the contradicting boundary does not raise the trusted range at once (clear-run STOP of 26.09, mechanism 1)
    axis_wall_drift: 0.8           # 15.10 (judge 13.10 problem 4, on; 0 = off): m; the monitored range (health monitored_range / clear_distance; not the corridor, no decision) ends where a near tunnel boundary, followed outward from the rail range, has come this much nearer the axis than it runs there (track.wall_drift_range): at a curve entry the quadratic axis lags the transition and the outer wall crosses the corridor; there the axis is 0.7-1.1 m off the wall-referenced track (roundT_pressureGate_roundT). Judge C probes: GO with the range past the object 26 -> 10 frames (person on the axis; on the wall-referenced track 26 -> 4), none left within 142 m; STOP unchanged. Cost: the ride's range capped in 13.8 % of frames (median at 94 m, 3.8 % of the range); also capping the corridor (beyond_axis) cost C's person 55 -> 43 STOP frames: not taken
    axis_wall_drift_max_offset: 3.5  # 15.10: m, only a boundary at most this far from the axis in the rail range is a reference (a single-track tube's wall; a double-track tunnel's far wall or a hall need not be parallel)
    axis_wall_drift_bins: 2        # 15.10: consecutive populated boundary bins (walls_bin) that must lie axis_wall_drift nearer
    floor_verify_enabled: true
    floor_verify_band:
    - 1.6
    - 3.5
    floor_verify_bin: 5.0          # m, along-track bin of the side-base profile
    floor_verify_window: 30.0      # m, window whose median deviation must stay within the tolerance
    floor_verify_tolerance: 0.5    # m, allowed deviation of the far side base from its near-range height
    floor_verify_min_points: 5     # side points per bin for the bin to count
    floor_verify_max_range: 250.0  # m, how far the verification is attempted
    axis_joint_fit: false          # (K2 held off for P4, captain 19.10; variant B: true / range false / min_curvature 0.0001 / reach_cap true) 19.10 (K2, off): joint least-squares axis of the near rail-pair midpoints and every tunnel-boundary segment (track.joint_axis_fit): tangent, curvature and a curvature step at axis_joint_knot from one fit, grown outward; off = as before
    axis_joint_knot: 60.0          # 19.10: m, X from which the curvature may change (C1 piecewise axis); 0 = a single quadratic
    axis_joint_step_sigma: 0.001   # 19.10: 1/m, prior SD of that curvature step
    axis_joint_min_far_bins: 4     # 19.10: boundary bins beyond the knot needed to fit a step
    axis_joint_rail_sigma: 0.03    # 19.10: m, SD of a rail-pair slab midpoint
    axis_joint_wall_sigma: 0.1     # 19.10: m, SD of a boundary bin
    axis_joint_tolerance: 0.3      # 19.10: m, a boundary bin joins the fit within this of the current fit
    axis_joint_grow_start: 40.0    # 19.10: m, first range of the outward growth
    axis_joint_grow_step: 16.0     # 19.10: m, growth step
    axis_joint_min_segment: 3      # 19.10: bins a boundary segment needs to take part
    axis_joint_range: true         # 20.10: with axis_joint_fit, the trusted range from the joint fit too (v3); false = axis shape only, range policy as before (v4)
    axis_joint_min_curvature: 0.0  # 19.10 (v5, off; 1/m; with axis_joint_fit and axis_joint_range false): > 0 = the estimator without the joint fit runs on its own state and is the output; the joint fit's shape replaces its axis shape only on frames with |curvature| >= this (a curve as it sees it); 0 = off (v4)
    axis_joint_reach_cap: false    # 19.10 (v5b, off; needs axis_joint_min_curvature > 0): on the frames with the joint shape, the trusted range also capped at the boundaries' reach along that axis + axis_valid_margin
    axis_joint_reach_dual: 0.0     # 20.10 (v5c, off; m; needs axis_joint_reach_cap): extends the capped range by this much (not beyond the base range); an obstacle starting between the cap and that end must also reach into the gauge from the base axis, else advisory as in v5b; 0 = off (v5b)
    walls_smoothing_distance: 0.0  # 19.10 (K1, off): m; > 0: the axis EMA exponent and rate limits per distance travelled (travel / this, at least walls_smoothing_min_k, at most the frame periods); unknown speed as before
    walls_smoothing_min_k: 0.05    # 19.10 (K1): lower bound of that exponent
    walls_smoothing_standstill_speed: 1.0  # 19.10 (K1): m/s; no speed estimate and a texture profile without any change count as standing while the last confident estimate is at most this
    walls_smoothing_standstill_max: 60.0  # 19.10 (K1): s; that standing rule at most this long in a row
  gauge:
    # v0.6: the train envelope given by the organizers (Q&A session): 2.1 m wide x 3.0 m high above the rail head,
    # from 0.12 m (lower objects on the track: the lowobj stage); the v0.5 polygon (1.40 m) is the advisory zone
    profile:
    - - -1.05
      - 0.12
    - - 1.05
      - 0.12
    - - 1.05
      - 3.0
    - - -1.05
      - 3.0
    warning_margin: 0.35
    range_min: 3.0
    range_max: 250.0
    lateral_growth_per_100m: 0.0
    edge_margin: 0.0
    edge_margin_per_100m: 0.15       # v0.6: strict decision needs points 0.15 m per 100 m inside the envelope edge (axis uncertainty)
    no_rail_range: 40.0              # v0.6.2: without the rail pair in the near range (stations, switch caverns) the corridor beyond 40 m is advisory only; 0 = off
    axis_union: 0                    # tried 26.09, NOT shipped (P3, judge A action 7; the safety review: blocking; 0 = off): inside also when inside the envelope measured from the SENSOR axis (the organizers' placement frame), only on straight track, within axis_union_range and where the rail axis is within axis_union_max_offset of the sensor axis; 1 = strict membership only (A), 2 = corridor coordinate re-measured (B), 3 = A with the shape rules reading the nearer reference's lateral (B2); A passed the gate (set O #6 0 -> 1 STOP frame) but takes in a long line at the corridor edge beside an object, and the oversize split then dropped both (ray-cast 19 -> 6 STOP frames; the split falls back to the rails' part since); B fails on the set O plank, B2 adds 3 ride events (docs/evidence/results/p3_edge_axis_2026-09-26.json, EXPERIMENTS 1m)
    axis_union_range: 50.0           # 26.09: m, near field only
    axis_union_max_offset: 0.3       # 26.09: m, below warning_margin (the union stays inside the advisory corridor)
    axis_union_max_curvature: 0.0002 # 26.09: 1/m, straight track only (R >= 5 km)
    reference: 3                     # 27.09 (P1 edge objects, on; 0 = the rails everywhere): the frame the envelope is measured from; 1 = the SENSOR axis (the organizers' placement frame) where it agrees with the rails (rail pair locked, straight track, X <= reference_range, the two axes within reference_max_offset), the rails elsewhere; 2 = as 1 with the offset clamped (a one-sided shift giving up to reference_max_offset of the rails' envelope on one side: not shipped, the safety review); 3 = the UNION: a return takes the sensor-axis lateral only where that is nearer the centre, so neither side of the rails' envelope is narrowed (gauge.union_shift); sets the strict membership and the shape rules' lateral of corridor candidates; the candidate set, the reported lateral, the gauge-distance reach, the rails' strict mask and the bed / low-object / ego-speed stages keep the rails; docs/QUALITY_CYCLE_2026-09-27.md
    reference_range: 60.0            # 27.09: m
    reference_max_offset: 0.2        # 27.09: m, below warning_margin (the rail envelope stays in the advisory corridor)
    reference_max_curvature: 0.0002  # 27.09: 1/m, straight track only (R >= 5 km)
    reference_along_rails: true     # 27.09: with gauge.reference, the along-track structure rules (cluster.linear_*, the edge signature) read the lateral from the rails, which such structure follows (false = from the reference)
    reference_edge_margin: 1.0       # 27.09: scale of edge_margin / edge_margin_per_100m where the sensor axis is the reference (the margin models the fitted rail axis' uncertainty; 0 = none)
  cluster:
    eps: 0.35
    range_scale: 40.0
    voxel: 0.05
    min_samples: 3
    min_points: 5
    min_points_far: 3
    far_range: 100.0
    weak_min_points: 4             # 27.09 (P5 range, on; 0 = off): a corridor cluster at least tracking.thin_far_min_distance away with fewer voxels than min_points / min_points_far but at least this many is kept as weak far evidence: like a far scan line it goes to the tracker only and counts only for a track that approaches (tracking.approach_*)
    weak_min_rings: 0              # experimental cross-ring sparse evidence; 0 = off until a real-bag A/B is measured
    weak_min_points_with_rings: 3   # minimum voxels for the cross-ring relaxation
    max_extent: 8.0
    oversize_split_max_length: 3.0 # on since 25.09 (P3; 0 = off): a cluster larger than max_extent keeps its part inside the strict gauge when that part is at most this long (an object touching a line at the corridor edge)
    oversize_split_max_distance: 30.0 # 25.09 (P3): ... and starts within this distance (m; beyond, long sparse far clusters gave a false alarm)
    structure_cut_tol: 1.3         # 13.10 (judge 13.10 problem 2; finished 14.10 with the judge's required changes; 14.10 review: 0.8 -> 1.3; 0 = off): a cluster larger than max_extent that the 25.09 split refused (dropped whole) is cut along the smooth surface it lies on (y = a + b x + c x^2 + d h + e h^2 in the vehicle frame, robust fit; not fitted without a strict-gauge point; not cut when the surface is steeper than 45 deg to the track): its points at least this far (m) in front of the surface as seen from the sensor are linked again on their own, and the parts at most oversize_split_max_length long, not thinner than min_height, with strict-gauge points and at least structure_cut_min_points voxels are described as clusters, every rule applied (clustering._off_structure_parts). A cluster whose split part was accepted keeps the split's verdict. On roundT_pressureGate_roundT the lagging far axis lays the tunnel wall across the envelope at 70-150 m; the judge's person-size box placed on that axis touches it and the 36-55 m cluster was dropped: GO / unrelated CAUTION at 82-120 m. The box stands 0.2-0.3 m in front of the fitted wall at 120 m, 0.6 at 109 m, 0.8 at 100 m, 1.2 at 92 m, 1.6-1.8 at 83-86 m. 14.10 review: at 0.8 m (13.10) objects standing 0.95-1.2 m in front of the outer wall - outside the envelope, in its advisory band, where the trusted near axis puts them (C's wall 2.25-2.3 m from the axis at 56-70 m) - were carved out and placed inside it by the lagging axis: wall-anchored ray-cast boxes yawed with the wall, STOP frames attributable to the object sealed -> 0.8 -> 1.3: person-size box 1.0 m from the wall 0 -> 21 -> 0 (with --dropout the same), 1.1 m 0 -> 15 -> 0, 2.6 m mast 1.0 m 0 -> 9 -> 0, sign post 0.95 m 0 -> 5 -> 0, column to the vault 1.0 m 0 -> 8 -> 0 (its face above 2.6 m dark: 0 -> 7 -> 0), cabinets 0.85-1.0 m 0 -> 0 -> 0; the mast 1.2 m off (at the envelope edge: lateral 1.03-1.11 at 60-68 m) 0 -> 27 -> 2. 1.3 m is more than the wall equipment (0.8-1.2 m) and more than C's wall stands outside the strict envelope (1.05 m); 1.2: the same 0s, mast 1.2 m 8; 1.0: 0 STOP frames but 1-3 single-frame parts per object, mast 1.2 m 19. Judge ray-cast on C (the box on the detector's axis), first STOP / held from (m) / STOP frames of 153, sealed -> 0.8 -> 1.3: person 73.9 / 81.3 / 49 -> 90.2 / 99.0 / 60 -> 82.8 / 91.6 / 55, 1 m cube 73.9 / 81.3 / 49 -> 96.1 / 106.5 / 64 -> 85.7 / 94.6 / 57, 0.5 m cube 75.4 / 82.8 / 50 -> 82.8 / 91.6 / 55 -> 75.4 / 82.8 / 50, lateral +0.5 69.5 / 76.9 / 46 -> 84.2 / 93.1 / 56 -> 72.5 / 79.8 / 48, -0.5 held 91.6 / 57 -> 112.4 / 70 -> 99.0 / 62, -0.7 85.7 / 94.6 / 57 -> 109.4 / 121.3 / 73 -> 96.1 / 106.5 / 64; no probe frame worse than sealed. Not taken: the review's option (a), parts cut beyond where the wall itself enters the strict envelope made advisory (beyond_axis): their advisory hits enter the object's track and its zone vote, person 73.9 / 49 sealed -> 71.0 / 47 (worse than sealed), 1 m cube 72.5 / 48. Blind spots: no gain nearer the wall than this (lateral +0.7, the wall side); none for an edge line plus a face beyond 30 m; C 100-150 m stays 0 / 34 STOP frames with GO at 118-150 m: there the lagging axis puts the box within 0.2-0.8 m of the wall (judge problem 4, the axis, not the split); a wall standing more than 2.35 m from the axis on a curve where the far axis lags could still have an object 1.3 m in front of it, outside the envelope, placed inside it
    structure_cut_max_spread: 0.12 # 13.10: m, ... only when the cluster is such a surface: the robust spread (1.4826 MAD) of its points about the fit at most this (the round wall of C: 0.08-0.11 m)
    structure_cut_min_fit: 0.8     # 13.10: ... and at least this fraction of its points within max(3 spread, tol / 2) of it (0.86-1.0 with the box on the wall of C)
    structure_cut_min_points: 8    # 14.10 (judge 13.10, required change 1; 0 = no bar): ... and a part at least this many voxels: its points are current-frame points (an oversize cluster falls back to them), 8 = the accumulated near bar (min_points 5 x 1.5). Every part carved out of wall equipment on the empty data at 0.8 m had 3-7 (alarm-capable ones: C 5, B 1, the ride 8, one detector; all removed, none left), the judge's objects 8-42; with 30 % dropout C gave one 11-voxel single-frame gauge part at 0.8 m (100 m, lateral 0.98, never confirmed)
    gauge_distance: true           # on since 25.09 (P3; false = off): a gauge cluster's distance is its nearest point inside the envelope, not a margin point it touches; since the review of 25.09 the envelope widened by the axis-uncertainty margin (edge_margin_per_100m), so never farther than where the object enters it
    min_height: 0.08
    thin_min_length: 3.0
    thin_max_width: 0.35
    thin_max_height: 0.25
    hardware_max_top: 0.35
    hardware_max_width: 0.4
    hardware_max_height: 0.3
    linear_min_aspect: 5.0
    linear_max_height: 0.8
    linear_min_lateral: 0.8
    wall_min_height: 1.9
    wall_min_lateral: 1.2
    wall_segment_min_length: 4.0
    wall_segment_max_width: 1.5
    wall_keep_gauge_voxels: 10     # 26.09 (P3 near escalation, candidate D for set O #6; 0 = off): a cluster the wall-at-the-side rule would drop is kept when it has >= this many strict-envelope voxels and starts within wall_keep_distance; gate PASS on top of tracking.near_escalate_*: the 2 x 2 m box at the envelope edge 0 -> 6 STOP frames from 10.3 m, set O inside STOP frames 349 -> 355, #5 / #7 / background, the ride, the five bags, doubleT_obstacle and set F identical (docs/evidence/results/p3_near_escalation_2026-09-26.json)
    wall_keep_distance: 20.0       # m
    gauge_min_points: 3
    overhead_min_height: 3.0       # v0.6: the envelope top (2.4 in v0.5)
    column_min_height: 2.2
    column_max_width: 1.0
    column_width_trim: 0.05         # 27.09 (P4 history, on; 0 = the box width): the column rule's width between these quantiles of the cluster's lateral point positions (a few returns joined at the DBSCAN radius do not widen a column past column_max_width)
    column_width_trim_min_cut: 0.25 # 27.09: m, the trimmed width counts only when it is at least this much narrower than the box width (sparse tails, a joined fragment of a few returns); a dense 1.0-1.1 m body keeps its width
    column_min_width: 0.25         # v0.6: near the axis only clusters this wide are columns (a hanging cable is thinner)
    column_core_margin: 0.02       # extra erosion after fresh rail-anchor/boundary checks; 0 disables core
    column_core_min_voxels: 8
    column_core_min_height: 2.2
    column_core_max_footprint: 0.8
    column_free_max_top: 0.0       # withdrawn from shipping after H4; explicit positive opt-in is experimental/unaccepted (WITHDRAWAL.md)
    column_free_min_core: 0.5      # experimental parameters are inert while column_free_max_top is zero
    column_free_min_returns: 2     # returns beyond the top on that ring (one ray: the recordings hold each echo twice)
    column_free_window: 1.2        # experimental continuation window; known dark-band ambiguity remains, not a shipping safety fix
    column_free_vault_margin: 0.3  # 15.10: m under the local vault (read over the axis; a round vault is 0.2-0.3 m lower over the envelope edge)
    column_free_tall_gap: 0.0      # additional experimental tall-following option; off, and requires the master opt-in
    elevated_min_height: 1.2
    elevated_min_width: 2.0
    floating_min_height: 0.7
    floating_max_height: 1.2
    floating_max_width: 1.0
    floating_long_min_length: 3.0  # on, decided 25.09 on the ride (0 = off): the floating shape also demotes clusters longer than this (m) along the track near the axis (overhead duct / tray / beam); ride 204 / 47 / 39 -> 197 / 46 / 39 alarm frames / events / STOP episodes, five bags 107 / 20 / 27 -> 60 / 14 / 17, set O, doubleT_obstacle and set F straight identical (docs/evidence/results/rules_decision_2026-09-25.json)
    floating_long_min_bottom: 1.6  # review 25.09: the long branch only for clusters whose lowest point is above this (m; 0 = no bottom condition); pre-registered 2.0 / 1.8 / 1.6, the highest keeping every gain: 2.0 ride 197 / 46 / 39 -> 204 / 47 / 39, 1.8 -> 202 / 47 / 40, 1.6 identical on every recording, the ride, set O and set F straight; what the long branch demotes on them has its bottom at 1.68-2.65 m but one unconfirmed single-frame cluster (docs/evidence/results/long_rule_bottom_2026-09-25.json)
    floating_free_max_size: 0.5    # on since 25.09 round 2 (0 = off): the floating shape does not demote a compact cluster (every extent at most this, m) hanging free inside the envelope; pre-registered A 0.5 / 0.95 / 2.5, gate PASS: set O cube #2 19 -> 30 STOP frames, first STOP 34.0 -> 52.5 m, six recordings, the ride and set F straight identical ...
    floating_free_max_dy: 1.2     # ... whose outermost point is at most this far off the axis (m; 27.09: 1.2, was 0.95 - an object reaching into the envelope from the side keeps the exemption; not reaching the wall side of the corridor, 1.40 m) ...
    floating_free_max_top: 2.5     # ... and whose top is at most this high (m; not hanging from the vault); docs/evidence/results/p3_signatures_2026-09-25.json
    edge_min_lateral: 1.0          # v0.6 (1.2 with the 1.40 m polygon)
    edge_min_aspect: 2.5
    edge_max_height: 1.0
    far_min_height: 0.6            # v0.6 far field (beyond the trusted height reference, within the trusted axis): at least this tall,
    far_max_length: 3.0            #   at most this long along the track,
    far_max_bottom: 1.0            #   and reaching below this height
    far_axis_both_sides: 0         # 25.09 (far_switch), off: 1 / 2 = a far obstacle needs both tunnel boundaries to support the axis (1 every frame, 2 bent frames only); tried, not shipped (EXPERIMENTS 1h)
    signature_min_lateral: 0.6     # v0.6: column / floating signatures only off the track centre (hanging cables are obstacles)
    short_signature_max_length: 0.0   # off, decided 25.09 on the ride (3.0 / 100 tried, not shipped: ride STOP episodes 39 -> 45 on top of the long rule, over the +5 limit; set O +49 STOP frames): > 0 = the elevated / floating signatures do not demote a cluster at most this long (m) ...
    short_signature_max_distance: 100.0   # ... and at most this far (m); the measured candidate is 3.0 / 100.0 (docs/P4_AUDIT.md)
    hanging_enabled: true          # on since 25.09 (SCORECARD #11; false = off): thin objects hanging from above into the envelope near the axis (clustering.find_hanging); the organizers' 5 cm object dips 0.2-0.4 m below the envelope top with 1-3 returns a frame and never reached min_points; pre-registered A / B / C, A the first to pass the gate: set O thin_hanging 0 -> 15 STOP frames, first STOP 30.1 m, five bags 58 / 13 / 16, ride 187 / 46 / 39, doubleT_obstacle, the other set O objects and set F straight identical (docs/evidence/results/p3_thin_hanging_2026-09-25.json)
    hanging_max_lateral: 0.8       # m, |dy| of the points searched
    hanging_min_height: 1.8        # m above the rail head, lowest point searched
    hanging_link_band: 0.6         # m above the envelope top where the linking points are searched (the roof stays out)
    hanging_min_voxels: 1          # voxels inside the strict envelope, with at least one more above its top (candidate A; 2 = candidate B)
    hanging_max_size: 0.5          # m along and across the track (a cable or rod, not a duct, tray or ceiling)
    hanging_max_distance: 60.0     # m; beyond it the rings above the sensor (0.5 deg apart) are too sparse for a 0.3 m dip
