    off_density: 0.15                # ... and below which it may switch off
    hold_frames: 10
    cell: [5.0, 0.5, 0.6]            # m, interior cells (X, dy, h) for the spread of isolated returns
    on_spread: 0.35
    off_spread: 0.2
    attach_factor: 0.0
    track_filter: true               # while on (or light), unsupported returns near the track are withheld from the track model
    track_margin: 10.0
    track_min_height: 0.15           # m above the rail head: rails / bed below are never withheld from the track model
    light_window: 20
    light_density: 0.05
    light_spread: 0.0                # 0 = off; 0.08 lost real STOPs at low density in development
    min_support: 3
    max_support: 12
    false_support: 0.001
    max_density: 50.0
    roi_half_width: 3.0
    roi_height: [-0.8, 4.5]
  voxel: 0.0
