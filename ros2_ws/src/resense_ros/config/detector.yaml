    persist_shift: [0.5, 3.0]        # m per nominal period; timestamp chain scales association by elapsed time
    persist_tol_dy: 0.12             # m, lateral match between frames
    persist_tol_h: 0.2               # m, height match between frames
    persist_tol_shift: 0.08          # m per nominal period, change of apparent displacement speed between links
