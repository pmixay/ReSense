# RESENSE_DATA is the host directory that holds the bags; it is mounted at /data in every
# service. It defaults to /data/for_hackathon, the path the README and scripts/ use.
# RESENSE_BAG is the bag inside it that the player and the headless demo play.
#
#   docker compose up detector                        # detector only (headless, no X11)
#   docker compose --profile tools up player          # play $RESENSE_BAG into it
#   docker compose --profile tools run --rm echo      # live distance readout, no X11
#   docker compose --profile viz up                   # + RViz (needs X11: xhost +local:docker)
#
#   RESENSE_DATA=/mnt/bags RESENSE_BAG=doubleT_obstacle docker compose --profile tools up
#
# No internet (the test stand): `docker load -i resense-image-<version>.tar.gz` first; with
# resense:latest present compose never builds or pulls (do not pass --build there).
x-data: &data
  network_mode: host
  ipc: host
  volumes:
    - ${RESENSE_DATA:-/data/for_hackathon}:/data:ro

services:
  detector:
    <<: *data
    build: { context: ., dockerfile: docker/Dockerfile }
    image: resense:latest
    command: ros2 launch resense_ros detector.launch.py
  player:
    <<: *data
    image: resense:latest
    profiles: ["tools"]
    command: ros2 bag play /data/${RESENSE_BAG:-roundT_doubleT} --clock --delay 3
  echo:
    # the headless equivalent of watching RViz: GO / CAUTION / STOP / FAULT
    image: resense:latest
    network_mode: host
    ipc: host                 # harmless: the image runs DDS over UDP (docker/fastdds_udp.xml)
    profiles: ["tools"]
    command: ros2 topic echo /resense/decision
  rviz:
    image: resense:latest
    network_mode: host
    ipc: host
    profiles: ["viz"]
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: rviz2 -d /opt/resense/ros2_ws/install/resense_ros/share/resense_ros/rviz/resense.rviz
  foxglove:
    image: resense:latest
    network_mode: host
    ipc: host
    profiles: ["viz"]
    command: ros2 launch foxglove_bridge foxglove_bridge_launch.xml port:=8765
