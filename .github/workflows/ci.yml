name: ci
on:
  push:
jobs:
  pytest:
    # The synthetic-tunnel tests need open3d; without it they are skipped, and a skipped
    # suite must never look green here: RESENSE_REQUIRE_SYNTHETIC=1 makes tests/conftest.py
    # fail the run on any skip, and the junit skip count is checked independently.
    runs-on: ubuntu-22.04
    env:
      RESENSE_REQUIRE_SYNTHETIC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      # open3d (the synthetic tunnel) links libEGL / libGL / libgomp / libusb, which the bare runner lacks
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libgomp1 libusb-1.0-0
      - run: pip install -e ".[dev]"
      - run: python -c "import open3d, sys; print('open3d', open3d.__version__, 'python', sys.version)"
      - run: python -m pytest -rs -q --junitxml=junit.xml
      - name: no test may have been skipped
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET, sys
          root = ET.parse("junit.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          print(f"junit: {tests} tests, {skipped} skipped")
          sys.exit(1 if skipped or tests == 0 else 0)
          PY
  web:
    # the dashboard replays a synthetic run in headless Chromium (web/demo/test_web.py, check_dashboard.py)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libgomp1 libusb-1.0-0
      - run: pip install -e ".[dev]" playwright && python -m playwright install --with-deps chromium
      - run: python -m pytest -q -rs web/demo
      - run: python web/demo/make_demo_run.py --out out/demo_run.jsonl && python web/demo/check_dashboard.py --jsonl out/demo_run.jsonl --screenshot out/dashboard_synthetic.png
  lint:
    # pyflakes + the pycodestyle error classes (ruff's default rule set) over the package, the ROS
    # node, the scripts and the tests; the version is pinned so a ruff release cannot turn CI red
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: pipx run ruff==0.15.8 check --output-format github .
  params-in-sync:
    # configs/default.yaml is the single source of truth; the ROS package carries a copy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/sync_params.sh --check
  docker:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t resense:ci --build-arg WITH_TOOLS=1 -f docker/Dockerfile .
      - name: unit tests inside the image (with open3d, so the synthetic-tunnel suite really runs)
        # -w / so that "import resense" resolves to the installed package, not to the source tree in the cwd
        run: docker run --rm -w / -e RESENSE_REQUIRE_SYNTHETIC=1 resense:ci python3 -m pytest -q -rs /opt/resense/tests
      - name: ROS 2 package is importable and the launch file resolves
        run: docker run --rm resense:ci bash -lc "ros2 pkg executables resense_ros && ros2 launch resense_ros detector.launch.py --print >/dev/null"
      - name: ROS 2 smoke test — two synthetic bags, both topic / frame pairs, through one running node (no dataset needed)
        run: >-
          docker run --rm resense:ci bash -lc
          "python3 scripts/make_smoke_bag.py /tmp/smoke_bag &&
          python3 scripts/make_smoke_bag.py /tmp/smoke_bag2 --topic /sensing/lidar/hesai128/pointcloud --frame-id lidar_livox --distance 45 &&
          scripts/smoke_test.sh /tmp/smoke_bag /tmp/smoke_bag2"
      - name: the organizers' way — the node in its own container, the bags played by a normal user from another one
        # a player that is not root cannot write into a root node's shared-memory segments (/dev/shm with
        # ipc=host): the image runs Fast DDS over UDP (docker/fastdds_udp.xml); this step keeps it that way
        run: |
          mkdir -p /tmp/bags && chmod 777 /tmp/bags
          docker run --rm -v /tmp/bags:/bags resense:ci bash -lc "python3 scripts/make_smoke_bag.py /bags/smoke_bag && python3 scripts/make_smoke_bag.py /bags/smoke_bag2 --topic /sensing/lidar/hesai128/pointcloud --frame-id lidar_livox --distance 45"
          IMAGE=resense:ci PLAYER_USER=1000:1000 scripts/console_test.sh /tmp/bags/smoke_bag /tmp/bags/smoke_bag2
      - name: the jury's console with stock Fast DDS — a uid-1000 player and listener without our profile, shared memory on
        # the organizers play from a host console with Humble's default rmw_fastrtps_cpp (no XML profile: shared
        # memory + UDPv4). PLAYER_DDS=stock unsets the image's FASTRTPS_DEFAULT_PROFILES_FILE in the player and in a
        # /resense/decision listener (both uid 1000, --net=host --ipc=host like a host console) and asserts that the
        # player really had shared memory on (its own segments in /dev/shm while it played) and the listener heard
        # STOP. The node keeps its UDP-only profile and announces no shared-memory locators, so the stock
        # participants must reach it over UDP; the bags are the previous step's
        run: |
          IMAGE=resense:ci PLAYER_USER=1000:1000 PLAYER_DDS=stock PLAYER_ENV="-e RMW_IMPLEMENTATION=rmw_fastrtps_cpp" \
            OUT=out/console_test_stock scripts/console_test.sh /tmp/bags/smoke_bag /tmp/bags/smoke_bag2
      - name: opt-in shared-memory mode (RESENSE_DDS=shm) — the stock uid-1000 player and listener reach the root node through /dev/shm
        # the node runs with -e RESENSE_DDS=shm: Fast DDS with shared memory + UDPv4 (docker/fastdds_shm_udp.xml),
        # its Fast DDS files in the host's /dev/shm opened to other users (docker/fastdds_shm_share.py). NODE_DDS=shm
        # in console_test.sh asserts on top of the stock step's criteria: the entrypoint's "DDS transport: shm"
        # line, root-owned port and data segments of mode 0666 in /dev/shm while the node runs (ls -l in
        # out/console_test_shm/shm_ls.txt), and that every play mapped a root-owned port segment, i.e. the
        # uid-1000 player opened the node's queue for writing; Fast DDS 2.6 then sends to a participant on the
        # same host through shared memory only (ProxyDataFilters.hpp). The listener hears STOP only if it could
        # open the node's data segment. The default (the steps above) stays UDP only
        run: |
          IMAGE=resense:ci PLAYER_USER=1000:1000 PLAYER_DDS=stock NODE_DDS=shm PLAYER_ENV="-e RMW_IMPLEMENTATION=rmw_fastrtps_cpp" \
            OUT=out/console_test_shm scripts/console_test.sh /tmp/bags/smoke_bag /tmp/bags/smoke_bag2
      - name: opt-in shared-memory mode — a player without shared memory (the image's UDP-only profile) still reaches the node
        run: |
          IMAGE=resense:ci PLAYER_USER=1000:1000 NODE_DDS=shm OUT=out/console_test_shm_udp \
            scripts/console_test.sh /tmp/bags/smoke_bag /tmp/bags/smoke_bag2
      # ---- offline delivery: the test machine has no internet (organizers, 25.09,
      # docs/organizers/answers.md section 7), so the jury gets the image as an archive and runs
      # `docker load`, then the node with no internet. The three steps below prove that chain.
      - name: offline delivery — docker save, docker rmi, docker load of the image built above
        id: roundtrip
        # scripts/export_image.sh saves resense:ci as resense:<version> + resense:latest into a
        # gzip archive with its .sha256; every tag of the image is then removed and the image must
        # be gone from the daemon; scripts/load_image.sh checks the sha256, loads the archive and
        # runs the import / ROS-executables check with --network none; the loaded image must have
        # the layers (diff IDs) of the one that was built. GZIP_LEVEL=1: speed over size in CI.
        run: |
          ID="$(docker image inspect -f '{{.Id}}' resense:ci)"
          LAYERS="$(docker image inspect -f '{{json .RootFS.Layers}}' resense:ci)"
          SKIP_BUILD=1 SOURCE_IMAGE=resense:ci GZIP_LEVEL=1 OUT_DIR=/tmp/dist scripts/export_image.sh
          ARCHIVE="$(ls /tmp/dist/resense-image-*.tar.gz)"
          docker ps -aq --filter "ancestor=$ID" | xargs -r docker rm -f >/dev/null   # a container left by an earlier step would pin the image
          read -r -a TAGS <<<"$(docker image inspect -f '{{join .RepoTags " "}}' "$ID")"
          docker rmi "${TAGS[@]}"
          if docker image inspect "$ID" >/dev/null 2>&1; then echo "image $ID still present after docker rmi" >&2; exit 1; fi
          scripts/load_image.sh "$ARCHIVE"
          test "$(docker image inspect -f '{{json .RootFS.Layers}}' resense:latest)" = "$LAYERS"
          echo "loaded $(docker image inspect -f '{{.Id}}' resense:latest), built $ID: same layers"
          docker tag resense:latest resense:ci      # any later step keeps its tag
          rm -rf /tmp/dist                          # the runner's disk is small
      - name: no network at all — the smoke test inside the loaded image with --network none
        # --network none leaves the container one interface, the loopback: no route anywhere, no
        # DNS, no registry, no LAN (a stand whose network card is down). scripts/check_no_network.py
        # proves it first (no TCP connection to public addresses, Docker Hub, the apt repositories
        # or PyPI); then the whole smoke test of this job runs in the loaded image the same way:
        # both bags made, the node on its launch file, ros2 bag play, the checker. DDS: the image's
        # Fast DDS profile (docker/fastdds_udp.xml, UDPv4, no interface whitelist) finds only the
        # loopback, joins the discovery multicast group on it, sends through the loopback-bound
        # socket Fast DDS opens for this very case ("network cable unplugged",
        # UDPTransportInterface.cpp, Fast DDS 2.6) and falls back to 127.0.0.1 unicast locators,
        # so node, player and recorder find each other. The profile the jury runs is unchanged:
        # ROS_LOCALHOST_ONLY is deliberately not set.
        if: ${{ !cancelled() && steps.roundtrip.outcome == 'success' }}
        run: |
          docker run --rm --network none resense:latest python3 scripts/check_no_network.py
          docker run --rm --network none resense:latest bash -lc "python3 scripts/make_smoke_bag.py /tmp/smoke_bag && python3 scripts/make_smoke_bag.py /tmp/smoke_bag2 --topic /sensing/lidar/hesai128/pointcloud --frame-id lidar_livox --distance 45 && scripts/smoke_test.sh /tmp/smoke_bag /tmp/smoke_bag2"
      - name: no internet, the organizers' way — node and a uid-1000 player in separate containers on an internal network
        # `docker network create --internal`: a bridge with no way out (no NAT; Docker's firewall
        # rules drop traffic to the outside), so the containers reach each other and nothing else,
        # as on a stand whose network card is up but not connected to the internet
        # (scripts/check_no_network.py proves it). Fast DDS discovers over the bridge (multicast
        # between the containers) and sends the clouds as unicast UDP. The node runs on the image's
        # default command, the player is a normal user in another container, as in
        # scripts/console_test.sh.
        if: ${{ !cancelled() && steps.roundtrip.outcome == 'success' }}
        run: |
          cleanup() { docker logs resense_off_node 2>&1 | tail -n 15 || true; docker rm -f resense_off_node resense_off_echo >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker network create --internal resense-offline
          mkdir -p /tmp/offline_bags /tmp/offline_out && chmod 777 /tmp/offline_bags /tmp/offline_out
          docker run --rm --network resense-offline resense:latest python3 scripts/check_no_network.py
          docker run --rm --network resense-offline -v /tmp/offline_bags:/bags resense:latest bash -lc "python3 scripts/make_smoke_bag.py /bags/smoke_bag && python3 scripts/make_smoke_bag.py /bags/smoke_bag2 --topic /sensing/lidar/hesai128/pointcloud --frame-id lidar_livox --distance 45"
          docker run -d --name resense_off_node --network resense-offline resense:latest >/dev/null
          for _ in $(seq 1 60); do docker logs resense_off_node 2>&1 | grep -q "ReSense detector listening" && break; sleep 1; done
          docker logs resense_off_node 2>&1 | grep -q "ReSense detector listening"
          docker run -d --name resense_off_echo --network resense-offline -v /tmp/offline_out:/out resense:latest bash -c "ros2 topic echo /resense/status --field data > /out/status.jsonl" >/dev/null
          sleep 4
          docker run --rm --network resense-offline --user 1000:1000 -e HOME=/tmp -v /tmp/offline_bags:/data:ro resense:latest bash -c "ros2 bag play /data/smoke_bag --delay 3 --disable-keyboard-controls && sleep 5 && ros2 bag play /data/smoke_bag2 --delay 3 --disable-keyboard-controls"
          sleep 4
          python3 scripts/check_dry_run.py /tmp/offline_out/status.jsonl --expect-obstacle --min-frames 20 --max-p95-latency 1000 --max-dropped 100000 --expect-inputs 2
  offline-build:
    # The release archive on a machine with no internet (docs/ARCHITECTURE.md "Deployment without
    # internet"). The archive is made as for the release (scripts/export_image.sh: runtime image,
    # base image pulled first so that it is resolved locally, inline layer cache, the base image's
    # tag inside); every image and the build cache are removed and the archive is loaded
    # (scripts/load_image.sh). Then two checks, both gating:
    # 1. offline `docker build`: with Docker Hub made unreachable, the documented command must
    #    rebuild the image from the loaded layers alone, from a checkout extracted under umask 002
    #    and normalised with the documented chmod: every layer identical to the archive's means
    #    that no step ran (a RUN that ran would need the network and would write new files). RUN
    #    is not given --network none here: the network mode is part of BuildKit's cache key, so it
    #    would miss the cache. Same Docker release for both builds, so this proves the mechanism,
    #    not the stand's Docker: for the jury the offline build stays best effort, `docker load`
    #    is the documented path.
    # 2. the jury's image plays bags: the runtime image exactly as loaded from the archive (the
    #    docker job plays through the WITH_TOOLS=1 image) runs the node on its default command on
    #    an --internal network, a uid-1000 player from the same image plays both smoke bags (made
    #    on the runner: the runtime image has no open3d / rosbags to make them), and
    #    scripts/check_dry_run.py reads the recorded /resense/status.
    # No continue-on-error since 25.09: check 1 passed on all four runs made with it
    # (36109782167, 36112092652, 36113989932, 36116178404).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: the release archive (scripts/export_image.sh; GZIP_LEVEL=1 for speed)
        run: OUT_DIR=/tmp/dist GZIP_LEVEL=1 scripts/export_image.sh
      - name: remove every image and the build cache, load the archive (scripts/load_image.sh)
        run: |
          VER="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' pyproject.toml | head -n 1)"
          echo "VER=$VER" >> "$GITHUB_ENV"
          docker image inspect -f '{{json .RootFS.Layers}}' "resense:$VER" > /tmp/layers_built.json
          docker rmi "resense:$VER" resense:latest ros:humble-ros-base-jammy
          docker builder prune -af >/dev/null
          docker image ls
          scripts/load_image.sh "/tmp/dist/resense-image-$VER.tar.gz"
          docker image inspect ros:humble-ros-base-jammy >/dev/null
      - name: docker build with no internet from the loaded archive (the documented command)
        run: |
          set -o pipefail
          echo "0.0.0.0 registry-1.docker.io auth.docker.io index.docker.io production.cloudflare.docker.com" | sudo tee -a /etc/hosts
          sleep 6       # Go's resolver in dockerd re-reads /etc/hosts at most every 5 s
          if docker pull hello-world >/dev/null 2>&1; then echo "Docker Hub is still reachable" >&2; exit 1; fi
          mkdir /tmp/jury_src
          git archive HEAD | (umask 002 && tar -x -C /tmp/jury_src -f -)
          cd /tmp/jury_src
          chmod -R u+rwX,go+rX,go-w .
          docker build --progress=plain --cache-from "resense:$VER" -t resense:offline -f docker/Dockerfile . 2>&1 | tee /tmp/offline_build.log
          grep -E '^#[0-9]+ (CACHED|\[)' /tmp/offline_build.log || true
          docker image inspect -f '{{json .RootFS.Layers}}' resense:offline > /tmp/layers_offline.json
          diff /tmp/layers_built.json /tmp/layers_offline.json
          echo "offline rebuild: every layer identical to the archive's, no step ran"
      # ---- check 2, the jury's image plays bags. The /etc/hosts entries of the step above name
      # Docker Hub's hosts only, so apt, PyPI and the pip cache are still reached; they stay, so
      # nothing below can pull from Docker Hub either. These steps run whenever the load step ran
      # (it sets VER), also after a failed offline rebuild: the two results are independent.
      - uses: actions/setup-python@v5
        id: py
        if: ${{ !cancelled() && env.VER != '' }}
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: the two synthetic smoke bags, made on the runner (the runtime image cannot make them)
        id: bags
        if: ${{ !cancelled() && steps.py.outcome == 'success' }}
        # make_smoke_bag.py needs open3d and rosbags (".[dev]", as in the pytest job); open3d links
        # libEGL / libGL / libgomp / libusb, which the bare runner lacks
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libgomp1 libusb-1.0-0
          pip install -e ".[dev]"
          mkdir -p /tmp/offline_bags
          python scripts/make_smoke_bag.py /tmp/offline_bags/smoke_bag
          python scripts/make_smoke_bag.py /tmp/offline_bags/smoke_bag2 --topic /sensing/lidar/hesai128/pointcloud --frame-id lidar_livox --distance 45
          chmod -R a+rX /tmp/offline_bags        # the player is uid 1000, the runner's user is not
          du -sh /tmp/offline_bags/*
          df -h /
      - name: no internet, the release archive's runtime image — node, recorder and a uid-1000 player on an internal network
        # As the docker job's step "no internet, the organizers' way", but every container runs
        # resense:$VER as scripts/load_image.sh loaded it from the archive. First it is proven to
        # be that image (the layers that were built and exported; export_image.sh's version and
        # commit labels, which resense:offline, the rebuild above, does not carry) and the runtime
        # one (no WITH_TOOLS=1 module), with ros2 bag and the sqlite3 storage plugin the bags need
        # (docker/Dockerfile's apt line). Then, on a `docker network create --internal` network:
        # scripts/check_no_network.py, the node on the image's default command, a /resense/status
        # recorder, a uid-1000 player that plays both bags into the running node (the input
        # switch), and scripts/check_dry_run.py on the recording.
        if: ${{ !cancelled() && steps.bags.outcome == 'success' }}
        run: |
          IMAGE="resense:$VER"
          NET=resense-offline-rt
          cleanup() {
            docker logs resense_rt_node 2>&1 | tail -n 15 || true
            docker rm -f resense_rt_node resense_rt_echo >/dev/null 2>&1 || true
            docker network rm "$NET" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          test "$(docker image inspect -f '{{json .RootFS.Layers}}' "$IMAGE")" = "$(cat /tmp/layers_built.json)"
          label() { docker image inspect -f "{{with .Config.Labels}}{{index . \"$1\"}}{{end}}" "$IMAGE"; }
          test "$(label org.opencontainers.image.version)" = "$VER"
          test "$(label org.opencontainers.image.revision)" = "$(git rev-parse HEAD)"
          echo "$IMAGE: $(docker image inspect -f '{{.Id}}' "$IMAGE"), the archive's image (version $VER, commit $(git rev-parse HEAD))"
          docker run --rm --network none "$IMAGE" python3 -c 'import importlib.util as u, sys; m = [n for n in ("open3d", "rosbags") if u.find_spec(n)]; print("WITH_TOOLS=1 modules in the image:", m or "none"); sys.exit(1 if m else 0)'
          docker run --rm --network none "$IMAGE" bash -c 'dpkg-query -W ros-humble-rosbag2 ros-humble-rosbag2-storage-default-plugins && s="$(ros2 bag list storage)" && echo "rosbag2 storage plugins: $s" && grep -qx sqlite3 <<<"$s"'
          docker network create --internal "$NET" >/dev/null
          mkdir -p /tmp/offline_rt_out && chmod 777 /tmp/offline_rt_out
          docker run --rm --network "$NET" "$IMAGE" python3 scripts/check_no_network.py
          docker run -d --name resense_rt_node --network "$NET" "$IMAGE" >/dev/null
          for _ in $(seq 1 60); do docker logs resense_rt_node 2>&1 | grep -q "ReSense detector listening" && break; sleep 1; done
          docker logs resense_rt_node 2>&1 | grep -q "ReSense detector listening"
          docker run -d --name resense_rt_echo --network "$NET" -v /tmp/offline_rt_out:/out "$IMAGE" bash -c "ros2 topic echo /resense/status --field data > /out/status.jsonl" >/dev/null
          sleep 4
          docker run --rm --network "$NET" --user 1000:1000 -e HOME=/tmp -v /tmp/offline_bags:/data:ro "$IMAGE" bash -c "ros2 bag play /data/smoke_bag --delay 3 --disable-keyboard-controls && sleep 5 && ros2 bag play /data/smoke_bag2 --delay 3 --disable-keyboard-controls"
          sleep 4
          python3 scripts/check_dry_run.py /tmp/offline_rt_out/status.jsonl --expect-obstacle --min-frames 20 --max-p95-latency 1000 --max-dropped 100000 --expect-inputs 2
          echo "the release archive's runtime image played both bags with no internet"
