name: ci
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -e ".[dev]"
      - run: pytest -q
  docker:
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t resense:ci -f docker/Dockerfile .
      - run: docker run --rm resense:ci python3 -m pytest -q /opt/resense/tests || true
