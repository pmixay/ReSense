name: pages
# The public site at https://pmixay.github.io/ReSense/ (gitbook/development/docs.md):
#   /            the GitBook of gitbook/, built with HonKit (pinned in gitbook/package-lock.json)
#   /dashboard/  the static web dashboard of web/ (replay of result files, the built-in demo, live
#                mode through a rosbridge the viewer supplies) and, under samples/, two node status
#                streams recorded in CI from the organizers' original bags. No server, no bag upload.
# Every push that touches these inputs builds the site (a broken book fails here, and the site is
# attached to the run); only `main` deploys it. The deploy needs the one-time repository setting
# Settings → Pages → Source: GitHub Actions; until then it is skipped with a notice instead of
# turning the run red.
on:
  push:
    paths:
      - "gitbook/**"
      - ".gitbook.yaml"
      - "web/index.html"
      - "web/assets/**"
      - "docs/evidence/p1_p2_supported_playback_2026-09-27/cached_bags_run_36319767736/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: the book (HonKit, pinned)
        working-directory: gitbook
        run: |
          node --version
          npm ci --no-audit --no-fund
          npx honkit build . ../_site
      - name: the dashboard and its sample status streams
        run: |
          mkdir -p _site/dashboard/samples
          cp web/index.html _site/dashboard/
          cp -r web/assets _site/dashboard/
          SRC=docs/evidence/p1_p2_supported_playback_2026-09-27/cached_bags_run_36319767736
          for BAG in doubleT_obstacle roundT_doubleT; do
            gunzip -c "$SRC/${BAG}_status.jsonl.gz" > "_site/dashboard/samples/${BAG}_status.jsonl"
          done
          {
            echo "Node status streams (/resense/status, one JSON object per line) for the ReSense web dashboard."
            echo "Recorded by CI run 36319767736 from the organizers' original bags doubleT_obstacle and"
            echo "roundT_doubleT, cold disk, ros2 bag play --read-ahead-queue-size 10."
            echo "Source: https://github.com/pmixay/ReSense/tree/main/$SRC"
            echo
            cat "$SRC/provenance.txt"
          } > _site/dashboard/samples/README.txt
          touch _site/.nojekyll
      - name: every page and link of the site exists
        run: |
          python3 - <<'EOF'
          import html, re
          from pathlib import Path
          root = Path("_site")
          required = ["index.html", "dashboard/index.html", "dashboard/assets/dashboard.css",
                      "dashboard/assets/result-format.js", "dashboard/assets/vendor/roslib.min.js",
                      "dashboard/samples/doubleT_obstacle_status.jsonl",
                      "dashboard/samples/roundT_doubleT_status.jsonl"]
          missing = [p for p in required if not (root / p).is_file()]
          bad = []
          for page in root.rglob("*.html"):
              if page.relative_to(root).parts[0] == "gitbook":
                  continue
              text = page.read_text(encoding="utf-8")
              for href in re.findall(r'(?:href|src)="([^"]+)"', text):
                  href = html.unescape(href)
                  if href.startswith(("http:", "https:", "mailto:", "#", "javascript:", "data:")):
                      continue
                  path, _, frag = href.partition("#")
                  target = (page.parent / path).resolve()
                  if not target.exists():
                      bad.append(f"{page}: {href}")
                  elif frag and target.suffix == ".html" and f'id="{frag}"' not in target.read_text(encoding="utf-8"):
                      bad.append(f"{page}: {href} (no anchor)")
          for line in missing + bad:
              print("::error::" + line)
          raise SystemExit(1 if missing or bad else 0)
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  pages-enabled:
    # GitHub Pages must be switched on once (Source: GitHub Actions); the read needs no admin rights.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type > build_type.txt 2>/dev/null; then
            echo "Pages build type: $(cat build_type.txt)"
            if [ "$(cat build_type.txt)" = workflow ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "::notice::GitHub Pages is set to build from a branch; set Settings → Pages → Source to 'GitHub Actions' to deploy this site."
          else
            echo "::notice::GitHub Pages is not enabled; set Settings → Pages → Source to 'GitHub Actions' and re-run this workflow to deploy the site."
          fi
          echo "enabled=false" >> "$GITHUB_OUTPUT"
  deploy:
    needs: [build, pages-enabled]
    if: needs.pages-enabled.outputs.enabled == 'true'
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
