name: dataset-cache
# Keeps the two original organizer bags of the cold-disk check (ci.yml, jobs "dataset" and
# "docker") in the Actions cache of the default branch, where every branch's runs can read it.
# GitHub evicts a cache entry that nobody used for 7 days; this refreshes it every 5 days, and a
# manual run seeds it. A hit downloads nothing; a miss asks Google Drive for the archive once
# (scripts/fetch_cold_bags.sh verifies the archive and the two bags against scripts/cold_bags.sha256)
# and saves the bags. Scheduled runs use the default branch's copy of this file.
on:
  schedule:
    - cron: "41 3 */5 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/cold_bags.sha256
      - scripts/fetch_cold_bags.sh
      - .github/workflows/dataset-cache.yml
jobs:
  cold-bags:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: the cache key (the pinned checksums)
        id: key
        run: echo "key=resense-cold-bags-${{ hashFiles('scripts/cold_bags.sha256', 'docs/evidence/bag_metadata/doubleT_obstacle_metadata.yaml', 'docs/evidence/bag_metadata/roundT_doubleT_metadata.yaml') }}" >> "$GITHUB_OUTPUT"
      - name: restore (a hit also refreshes the entry's last use)
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ~/resense-cold-bags
          key: ${{ steps.key.outputs.key }}
      - name: verify a hit, or download once, unpack and verify on a miss
        run: |
          if [[ "${{ steps.restore.outputs.cache-hit }}" == "true" ]]; then
            NO_DOWNLOAD=1 scripts/fetch_cold_bags.sh ~/resense-cold-bags
          else
            pip install --quiet "zstandard>=0.22"
            scripts/fetch_cold_bags.sh ~/resense-cold-bags
          fi
      - name: save on a miss
        if: ${{ steps.restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/resense-cold-bags
          key: ${{ steps.key.outputs.key }}
