name: web-tests
# The web prototype's checks, on demand: Actions, web-tests, Run workflow. They are not part of the push
# gate (ci.yml): the browser suites need Chromium with software WebGL and the end-to-end suite alone takes
# about 30 runner-minutes. Without `browser` this is the light part (the backend wheels and tests, the
# frontend unit tests, type check and production build, a few minutes); with it the dashboard tests in
# headless Chromium (web/demo) and the browser suite (webapp/e2e) follow. Any skipped test fails the run.
# The workflow must exist on the default branch for GitHub to offer it.
on:
  workflow_dispatch:
    inputs:
      browser:
        description: "also run the browser suites: web/demo in Chromium and webapp/e2e (about 30 min)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      RESENSE_REQUIRE_WEB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            ros2_ws/src/resense_ros/setup.py
            webapp/backend/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      # open3d (synthetic bags in the backend tests) links libEGL / libGL / libgomp / libusb
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libgomp1 libusb-1.0-0
      - id: install
        run: |
          pip install -e ".[dev]" -e ros2_ws/src/resense_ros -e "webapp/backend[dev]" wheel
          cd webapp/frontend && npm ci
      - name: backend and policy wheels outside the checkout, without ROS
        run: python scripts/check_webapp_wheels.py
      - name: backend (webapp/backend)
        run: cd webapp/backend && python -m pytest -q -rs --junitxml=../../junit-webapp-backend.xml
      - name: frontend unit tests, type check and production build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: cd webapp/frontend && npm test && npm run build
      - name: Playwright and Chromium
        if: ${{ inputs.browser && !cancelled() && steps.install.outcome == 'success' }}
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: the dashboard tests in headless Chromium (web/demo)
        if: ${{ inputs.browser && !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -q -rs --junitxml=junit-web.xml web/demo
      - name: the dashboard replays a synthetic run (web/demo/check_dashboard.py)
        if: ${{ inputs.browser && !cancelled() && steps.install.outcome == 'success' }}
        run: python web/demo/make_demo_run.py --out out/demo_run.jsonl && python web/demo/check_dashboard.py --jsonl out/demo_run.jsonl --screenshot out/dashboard_synthetic.png
      - name: browser suite against the production build (webapp/e2e)
        if: ${{ inputs.browser && !cancelled() && steps.install.outcome == 'success' }}
        env:
          WEBAPP_DIST: webapp/frontend/dist
        run: python -m pytest -q -rs --junitxml=junit-webapp-e2e.xml webapp/e2e
      - name: no web test may have been skipped
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET, sys
          bad = False
          for path in ("junit-webapp-backend.xml", "junit-web.xml", "junit-webapp-e2e.xml"):
              if not os.path.exists(path):
                  continue
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == "testsuite" else list(root)
              tests = sum(int(s.get("tests", 0)) for s in suites)
              skipped = sum(int(s.get("skipped", 0)) for s in suites)
              print(f"{path}: {tests} tests, {skipped} skipped")
              bad = bad or bool(skipped) or tests == 0
          sys.exit(1 if bad else 0)
          PY
