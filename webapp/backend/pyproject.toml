[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "resense-web"
version = "0.1.0"
description = "ReSense web prototype: FastAPI backend (uploads, job queue, runs, presets, live replay)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "resense",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pyyaml>=6",
    "numpy>=1.23",
    "rosbags>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
resense-web = "resense_web.__main__:main"

[tool.setuptools.packages.find]
include = ["resense_web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
